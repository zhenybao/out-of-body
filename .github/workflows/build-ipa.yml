name: Build Out of Body IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate the Xcode project with the depth model
        run: |
          brew install xcodegen
          bash tools/fetch_model.sh
          xcodegen generate

      - name: Build the unsigned iPhone app
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        run: |
          xcodebuild -version
          if ! xcrun --sdk iphoneos metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent metalToolchain
          fi
          xcodebuild -project OutOfBody.xcodeproj \
            -scheme OutOfBody -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Package the IPA
        run: |
          app=build/Build/Products/Release-iphoneos/OutOfBody.app
          test -f "$app/OutOfBody"
          test -f "$app/default.metallib"
          test -d "$app/DepthAnythingV2SmallF16.mlmodelc"
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry OutOfBody-unsigned.ipa Payload
          unzip -tq OutOfBody-unsigned.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: OutOfBody-unsigned
          path: OutOfBody-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
